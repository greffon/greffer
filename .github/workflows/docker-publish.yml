name: docker-publish

on:
  push:
    branches:
      - 'main'

# Read-only token. Nothing in this workflow uses GITHUB_TOKEN: it authenticates
# to Docker Hub with DOCKERHUB_TOKEN and pushes no GHCR package, so it needs no
# `packages: write` and no `contents: write`. Without this the default is a
# WRITE-scoped token held across `poetry install`, five `docker build`s and
# several third-party actions.
permissions:
  contents: read

# SERIALIZE publishes: one stable group for the whole branch, so a second merge
# queues behind the first instead of running alongside it. All five builds push
# the same mutable `:latest` tags and the signing loop re-resolves digests from
# them, so two concurrent runs can interleave and leave an older or mixed image
# set as `:latest`.
#
# Note this is the OPPOSITE of the per-SHA grouping used by the CI workflows.
# There the goal is that every SHA keeps its own result, so runs must never
# contend; here the goal is that publishes never overlap, so they must.
#
# cancel-in-progress: false because a half-finished publish can leave some of
# the four greffon/* images pushed at the new version and others not, splitting
# proxy-mode and tunnel-mode nodes onto different builds.
#
# Accepted trade-off: a concurrency group holds one running plus one pending
# run, so if a third merge lands while one is running the middle SHA's publish
# is dropped. `:latest` still converges to the newest commit; only an
# intermediate version tag could be skipped, which needs three merges inside a
# single publish window AND a version bump on the middle one. Serialization is
# worth more than publishing every intermediate SHA.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: the fleet's self-update consumes the signatures produced below, so a
  # signed image must never be built from an untested commit. Runs the same
  # suite as ci.yml (which covers PRs); `docker` needs it, so a red suite
  # blocks the publish entirely.
  #
  # Deliberately a job in THIS workflow rather than a `workflow_run` gate on
  # ci.yml. workflow_run executes from the default branch with the full secret
  # set, fires on any branch's completion including fork PRs, and its
  # github.sha is the default-branch tip rather than the SHA that was tested —
  # so it would reintroduce the very untested-publish hole it aims to close.
  test:
    # ubuntu-latest with a live Docker daemon is required; see the runner note
    # in ci.yml (apps/utils/docker/base.py builds a client at import time).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install --no-cache-dir "poetry==1.8.5"

      - name: Install dependencies
        # No cache here on purpose: this is the gate in front of a signed fleet
        # release, so it resolves from poetry.lock every time rather than
        # trusting a restored env. --sync matches ci.yml so the two paths
        # cannot diverge if a cache is ever added here.
        run: poetry install --no-interaction --sync

      - name: Run tests
        run: poetry run pytest tests/ -q

      # cli/ is a SEPARATE poetry project with its own lockfile and its own
      # testpaths, so the run above (root `testpaths = ["tests"]`) never
      # collects it. That matters here and not in ci.yml: Dockerfile.updater
      # line 25 is `COPY cli/ /src/`, so greffon/greffer-updater is built
      # entirely from cli/ source — including updater/provenance.py, the code
      # that runs `cosign verify` on customer nodes — and it is in the signed
      # set below. Without this leg the gate would sign that image having
      # tested none of it, which is precisely the hole this workflow claims to
      # close.
      #
      # cli-release.yml also runs these, but only on `pull_request` with
      # `paths: ['cli/**']` and on `cli-v*` tags, so a push straight to main
      # reaches the publish with cli/ untested.
      - name: Run CLI tests
        working-directory: cli
        run: |
          poetry install --no-interaction --sync
          poetry run pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      -
        name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        # The node-image build steps below use the Git context
        # ({{defaultContext}}), so the repo is not otherwise checked out; this
        # step puts app/__init__.py + the updater build context (cli/,
        # Dockerfile.updater, min_supported_baseline) on the runner.
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Extract greffer node version
        id: version
        # Publish the greffer-node images (greffer, greffer-nginx,
        # tunnel-sidecar) under BOTH :latest and the node version, so the
        # self-update flow has a concrete tag to update to and a prior
        # tag/digest to roll back to. The version is app/__init__.py
        # __version__, the same value reported to the manager as
        # Greffer.version, so the published tag matches what the manager's
        # "update available" check compares against.
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/__init__.py)"
          if [ -z "$version" ]; then
            echo "could not read __version__ from app/__init__.py" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing greffer-node images at :latest and :$version"
      -
        name: Assert signed set covers shipped greffon/* images
        # Set-closure (v2 trust model): every greffon/* image the shipped compose
        # template renders MUST be in the enumerated signed set below, so a future
        # service can never ship unsigned and brick the fail-closed verify. Runs
        # unconditionally (a pure guard, no cosign needed). greffer-updater is
        # signed too but is spawned standalone, not part of the rendered stack.
        run: |
          set -euo pipefail
          tmpl="cli/greffer_cli/templates/compose.yml"
          signed="greffon/greffer greffon/greffer-nginx greffon/tunnel-sidecar greffon/greffer-updater"
          rendered="$(grep -oE 'greffon/[A-Za-z0-9._-]+' "$tmpl" | sort -u)"
          for repo in $rendered; do
            case " $signed " in
              *" $repo "*) ;;
              *) echo "::error::$repo is rendered by $tmpl but is not in the signed set" >&2; exit 1 ;;
            esac
          done
          echo "signed set covers all greffon/* images in $tmpl"
      -
        name: Require cosign key material
        id: cosign_cfg
        # FAIL CLOSED. This step used to emit a ::warning:: and continue,
        # publishing UNSIGNED greffon/greffer:latest, greffer-nginx and
        # tunnel-sidecar while main stayed green. That turns a config outage
        # (an expired, rotated, or cleared key) into a silent trust downgrade
        # for the whole fleet, and it is the same "absence of signal reads as
        # green" failure this workflow is otherwise careful about.
        #
        # Note COSIGN_PUBLIC_KEY is a repository VARIABLE, not a secret, so it
        # carries weaker access controls than the private key it gates:
        # clearing it alone was enough to flip the entire pipeline to unsigned.
        #
        # landing-page's publish-greffer-version.yml already refuses loudly on
        # missing key material; this now matches it. If an unsigned build is
        # ever genuinely needed, add an explicit workflow_dispatch input for it
        # rather than letting an empty secret decide.
        #
        # Comparing a secret to '' yields a boolean, never the secret value, so
        # echoing these is safe.
        env:
          HAS_PRIV: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
          HAS_PASS: ${{ secrets.COSIGN_PASSWORD != '' }}
          HAS_PUB: ${{ vars.COSIGN_PUBLIC_KEY != '' }}
        run: |
          if [ "$HAS_PRIV" != "true" ] || [ "$HAS_PASS" != "true" ] || [ "$HAS_PUB" != "true" ]; then
            echo "::error::cosign key material missing (COSIGN_PRIVATE_KEY=$HAS_PRIV, COSIGN_PASSWORD=$HAS_PASS, COSIGN_PUBLIC_KEY=$HAS_PUB). Refusing to publish unsigned fleet images." >&2
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "cosign key material present"
      -
        # Install cosign BEFORE the builds so the next step can prove the key
        # works while nothing has been pushed yet.
        name: Install cosign
        uses: sigstore/cosign-installer@v3
      -
        name: Prove the signing key is usable before pushing anything
        # Presence is not usability. The check above only proves the three
        # values are non-empty; it cannot tell whether COSIGN_PASSWORD actually
        # decrypts COSIGN_PRIVATE_KEY, whether the private key and the declared
        # public key are a PAIR, or whether cosign itself works. Without this
        # step a rotated-but-mismatched password sails through, all five images
        # push (including four :latest tags), and only then does `cosign sign`
        # fail 150 lines later — leaving UNSIGNED fleet images live while the
        # job goes red. The old ::warning:: behaviour at least failed in the
        # same place; a presence-only gate just moves the failure without
        # closing it.
        #
        # `cosign public-key` derives the public half from the private key,
        # which requires the password, so a single command proves all three:
        # password correct, pair matches, cosign functional. Runs before the
        # first `push: true`, so a failure here publishes nothing.
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          trap 'rm -f declared.pub derived.pub' EXIT
          printf '%s' "$COSIGN_PUBLIC_KEY" > declared.pub
          # Fails here if COSIGN_PASSWORD does not decrypt the private key.
          cosign public-key --key env://COSIGN_PRIVATE_KEY > derived.pub
          # Fails here if the private key and the declared public key are not
          # a pair — i.e. the fleet would be signed with a key that no node's
          # baked cosign.pub can verify.
          if ! diff -q derived.pub declared.pub >/dev/null; then
            echo "::error::COSIGN_PRIVATE_KEY does not match the COSIGN_PUBLIC_KEY variable. Refusing to publish." >&2
            exit 1
          fi
          echo "signing key verified: password decrypts the key and the pair matches"
      -
        name: Stage cosign public key for the updater build
        # Deliver cosign.pub to the updater build as a FILE, not an inline secret.
        # docker/build-push-action's `secrets:` input is newline-delimited
        # `id=value`, so a multi-line PEM passed inline (cosign_pub=${{ ... }}) is
        # truncated to its FIRST line and the baked /etc/greffer/cosign.pub is an
        # unusable 26-byte stub ("PEM decoding failed" -> every remote update fails
        # cosign verify). Writing it to a file + `secret-files:` preserves the full
        # key. printf '%s' (no added newline) matches the sign step's key handling.
        if: steps.cosign_cfg.outputs.enabled == 'true'
        env:
          COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
        run: printf '%s' "$COSIGN_PUBLIC_KEY" > "${{ runner.temp }}/cosign.pub"
      -
        name: Build and push Greffer Nginx
        uses: docker/build-push-action@v3
        with:
          context: "{{defaultContext}}:nginx"
          push: true
          tags: |
            greffon/greffer-nginx:latest
            greffon/greffer-nginx:${{ steps.version.outputs.version }}
          # OCI version label the v2 updater reads (docker inspect) to get each
          # verified image's real version for the min_supported floor + cohesion
          # check, without trusting the tag.
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          # Multi-arch: amd64 + arm64. Base is nginx:1.20.2-alpine-perl
          # (multi-arch manifest, no per-arch downloads), so arm64 is a
          # pure rebuild. Without this the image is amd64-only and the
          # rendered ~/.greffer/docker-compose.yml fails to pull on ARM
          # hosts (Apple Silicon, Graviton, Pi, Windows-on-ARM/WSL2)
          # with "no matching manifest for linux/arm64/v8".
          platforms: linux/amd64,linux/arm64
      -
        name: Build and push Greffer Updater
        # The detached, signed container the greffer spawns for a remote update
        # (self-update v2). Built from the runner checkout (context: .) so it can
        # COPY cli/ + the baseline; cosign.pub is delivered as a build secret from
        # the COSIGN_PUBLIC_KEY variable and baked in (a public key, persisted on
        # purpose). Gated: an updater without its verify key is useless, so it only
        # builds once the managed key is provisioned. Built BEFORE the greffer
        # image so its digest can be baked into it (next two steps).
        if: steps.cosign_cfg.outputs.enabled == 'true'
        uses: docker/build-push-action@v3
        with:
          context: .
          file: Dockerfile.updater
          push: true
          tags: |
            greffon/greffer-updater:latest
            greffon/greffer-updater:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          # File, not inline (see "Stage cosign public key"): inline `secrets:`
          # truncates the multi-line PEM to its first line.
          secret-files: |
            cosign_pub=${{ runner.temp }}/cosign.pub
      -
        name: Resolve greffer-updater digest
        # Pin the updater by its published index digest so the greffer image can
        # bake GREFFER_UPDATER_IMAGE (operators never copy a digest per host).
        # Skipped (empty output) in unsigned builds, where the greffer bakes no
        # default and the operator sets GREFFER_UPDATER_IMAGE explicitly.
        id: updater
        if: steps.cosign_cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          d="$(docker buildx imagetools inspect greffon/greffer-updater:${{ steps.version.outputs.version }} --format '{{.Manifest.Digest}}')"
          case "$d" in sha256:*) ;; *) echo "::error::could not resolve updater digest (got '$d')" >&2; exit 1 ;; esac
          echo "ref=greffon/greffer-updater@$d" >> "$GITHUB_OUTPUT"
      -
        name: Build and push Greffer
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: |
            greffon/greffer:latest
            greffon/greffer:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          # Bake the matching updater digest so a deployed greffer spawns it
          # digest-pinned with no per-host config (v2 trust model: "pin the updater
          # digest into the greffer build"). Empty in unsigned builds (no updater
          # published) and overridable via env.env. The empty-string default keeps
          # the ARG valid when the resolve step was skipped.
          build-args: |
            GREFFER_UPDATER_IMAGE=${{ steps.updater.outputs.ref }}
          # Multi-arch: amd64 + arm64. Base is python:3.11-alpine
          # (multi-arch manifest, no per-arch downloads), so arm64 is a
          # pure rebuild. Pairs with the greffer-nginx step above — both
          # services in the proxy-mode compose must ship arm64 or the
          # pull aborts on ARM hosts.
          platforms: linux/amd64,linux/arm64
      -
        name: Build and push Tunnel Sidecar
        uses: docker/build-push-action@v3
        with:
          context: "{{defaultContext}}:tunnel-sidecar"
          push: true
          tags: |
            greffon/tunnel-sidecar:latest
            greffon/tunnel-sidecar:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          # Multi-arch: amd64 + arm64. The tunnel-sidecar Dockerfile
          # downloads the correct rathole binary per TARGETARCH; the
          # smoke-test on greffon/greffon root confirmed Debian-slim
          # base runs both arches cleanly.
          platforms: linux/amd64,linux/arm64
      -
        name: Build and push Rathole Server
        uses: docker/build-push-action@v3
        with:
          context: "{{defaultContext}}:rathole-server"
          push: true
          tags: greffon/rathole-server:latest
          # Not a greffer-node image (it is the manager-side relay), so it is
          # outside the v2 updater verify set: no version label, not signed.
          # Multi-arch wraps rapiz1/rathole's published Linux artefacts
          # (amd64 gnu, arm64 musl). Replaces direct use of
          # rapiz1/rathole:v0.5.0 in greffon/greffon root compose, which
          # only ships an amd64 manifest and forces emulation on
          # ARM hosts (Apple Silicon, Graviton, Pi).
          platforms: linux/amd64,linux/arm64
      -
        name: Sign + smoke-verify images (managed key, no tlog)
        # Sign every greffon/* image by DIGEST with a per-repo annotation, exactly
        # what the updater's offline verify requires (managed key, --tlog-upload
        # =false to match the verify side's --insecure-ignore-tlog). Each sign is
        # immediately round-tripped with the greffer's EXACT verify command, so a
        # cosign flag/behaviour drift fails the release here instead of silently
        # bricking updates in production.
        if: steps.cosign_cfg.outputs.enabled == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          printf '%s' "$COSIGN_PUBLIC_KEY" > cosign.pub
          # Public key, but tidy up unconditionally even if a verify aborts the loop.
          trap 'rm -f cosign.pub' EXIT
          for repo in greffon/greffer greffon/greffer-nginx greffon/tunnel-sidecar greffon/greffer-updater; do
            # digest is re-derived per $repo, so a signature can only ever carry
            # the repo annotation of the image it actually belongs to (the
            # repo-binding the updater verify depends on). Keep this in the loop.
            digest="$(docker buildx imagetools inspect "$repo:$version" --format '{{.Manifest.Digest}}')"
            case "$digest" in
              sha256:*) ;;
              *) echo "::error::could not resolve a sha256 digest for $repo:$version (got '$digest')" >&2; exit 1 ;;
            esac
            ref="$repo@$digest"
            echo "::group::sign $ref"
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
              --tlog-upload=false -a "repo=$repo" "$ref"
            # Round-trip 1: the updater's EXACT signature verify
            # (provenance.cosign_verify) so a cosign flag/behaviour drift fails here.
            cosign verify --key cosign.pub \
              -a "repo=$repo" --insecure-ignore-tlog=true "$ref"
            # Round-trip 2: the version-label read the floor + cohesion check
            # depend on (provenance.image_version): pull the SIGNED digest and
            # assert the OCI label is present + correct, so "signature verifies"
            # also guarantees "the updater can read this image's version".
            docker pull "$ref" >/dev/null
            got="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$ref")"
            [ "$got" = "$version" ] || { echo "::error::$repo version label is '$got', expected '$version'" >&2; exit 1; }
            echo "::endgroup::"
          done
          echo "signed + verified (signature + version label) all 4 greffon/* images at $version"
